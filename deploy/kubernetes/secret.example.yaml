# An example only: never commit a real password in a manifest. Create the
# Secret from a file instead, or through your cluster's secret management:
#
#   kubectl create secret generic kea-metrics-exporter-credentials \
#     --from-file=password=./kea-password.txt
apiVersion: v1
kind: Secret
metadata:
  name: kea-metrics-exporter-credentials
  labels:
    app.kubernetes.io/name: kea-metrics-exporter
type: Opaque
stringData:
  password: "replace-me"
